name: Backend & dashboard

on:
  push:
    branches: [main]
    paths: ["backend/**", "dashboard/**", ".github/workflows/backend.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smsgw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: smsgw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsgw" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://smsgw:ci-password@localhost:5432/smsgw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json
      - name: Install PostgreSQL 16 client (for the backup/restore test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client
      - name: Backend typecheck and tests (includes the 6,000-recipient load test)
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Dashboard build
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
        run: |
          npm ci
          npm run build
