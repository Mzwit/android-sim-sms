name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release signing key (only if the repository secrets exist)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the release key from repository secrets"
          else
            echo "::warning::No SIGNING_KEY_BASE64 secret: signing with the development key in android/keystore (fine for testing, not for production)"
          fi

      - name: Unit tests and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/sim-sms-gateway-1.0.${{ github.run_number }}.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sim-sms-gateway-apk
          path: android/out/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 7

      - name: Publish as the "latest-apk" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk out/*.apk out/SHA256SUMS.txt \
            --title "Android gateway app 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install on the gateway phone (allow installs from this source). Signed with $([ -n "$SIGNING_STORE_FILE" ] && echo 'the release key' || echo 'the DEVELOPMENT key; add signing secrets for production')." \
            --prerelease --target ${{ github.sha }}
