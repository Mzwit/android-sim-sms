# Android SIM SMS Gateway — PC services
#   docker compose up -d --build
# Dashboard + API: http://localhost:8443 (https://<LAN IP>:8443 once a certificate is configured)
name: smsgw

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smsgw
      POSTGRES_USER: smsgw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Africa/Mbabane
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    # Only reachable from this PC (for backups and tests), never from the LAN.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsgw -d smsgw"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8443
      DATABASE_URL: postgres://smsgw:${POSTGRES_PASSWORD}@db:5432/smsgw
      TZ: Africa/Mbabane
    volumes:
      - ./certs:/app/certs:ro
    # For HTTPS on your LAN (needed before pairing a phone over Wi-Fi):
    #   cd backend; npm run cert -- --ip 192.168.1.20   (your PC's LAN IP)
    # then set TLS_CERT_PATH=/app/certs/server.crt and TLS_KEY_PATH=/app/certs/server.key in .env
    # BIND_ADDRESS=127.0.0.1 keeps it on this PC only. To pair a phone over Wi-Fi, configure TLS
    # and set BIND_ADDRESS to the PC's LAN IP. Never port-forward this to the internet.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8443:8443"

volumes:
  pgdata:
